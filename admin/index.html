<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — Bar Mubiti</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/css/admin.css?v=1">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">Bar Mubiti <span>Admin</span></div>
    <p class="login-sub">Sign in to manage your website content.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
      <div class="login-error" id="loginError" role="alert"></div>
    </form>

    <div class="setup-note" id="setupNote">
      Checking connection…
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/supabase-config.js?v=1"></script>
<script src="/admin/js/admin-auth.js?v=1"></script>
</body>
</html>
